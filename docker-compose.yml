services:
  esxi-mcp:
    build: .
    image: esxi-mcp:latest
    container_name: esxi-mcp
    stdin_open: true    # Required for MCP stdio transport
    environment:
      - VSPHERE_PASSWORD_VC_MAIN=${VSPHERE_PASSWORD_VC_MAIN:?VSPHERE_PASSWORD_VC_MAIN must be set}
      # - VSPHERE_PASSWORD_ESXI_BJ=${VSPHERE_PASSWORD_ESXI_BJ:?VSPHERE_PASSWORD_ESXI_BJ must be set}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - esxi-logs:/app/logs
    restart: unless-stopped

volumes:
  esxi-logs:
