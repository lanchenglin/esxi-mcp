services:
  esxi-mcp:
    build: .
    image: esxi-mcp:latest
    container_name: esxi-mcp
    network_mode: host
    stdin_open: true    # Required for MCP stdio transport
    environment: []

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - esxi-logs:/app/logs
    restart: unless-stopped

volumes:
  esxi-logs:
