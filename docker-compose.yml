services:
  esxi-mcp:
    build: .
    image: esxi-mcp:latest
    container_name: esxi-mcp
    network_mode: host
    stdin_open: true
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-stdio}
      - MCP_PORT=${MCP_PORT:-8000}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - esxi-logs:/app/logs
    restart: unless-stopped

volumes:
  esxi-logs:
