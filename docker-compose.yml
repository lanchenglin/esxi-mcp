services:
  esxi-mcp:
    build: .
    image: esxi-mcp:latest
    container_name: esxi-mcp
    stdin_open: true    # Required for MCP stdio transport
    environment:
      - VSPHERE_PASSWORD=${VSPHERE_PASSWORD:?VSPHERE_PASSWORD must be set}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - esxi-logs:/app/logs
    restart: unless-stopped

volumes:
  esxi-logs:
